# Pushes from Claude's sessions do not start the Pages build by themselves: ask GitHub for one on every push to main.
name: Request Pages build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
